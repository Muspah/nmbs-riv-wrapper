name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

env:
  FTP_HOST: web0165.zxcs.nl
  REPO: /tmp/deploy-repo
  ARTIFACT_PATH: nl/ovdata/nmbs-api-wrapper

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
      # Main hosting account logs in at its home dir; the URL path cds into the repo root (repo.internetpolice.eu).
      LFTP: lftp ftp://web0165.zxcs.nl/domains/repo.biemcraft.nl/public_html/repo
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Check tag matches pom version
        if: env.RELEASE == 'true'
        run: test "v$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)" = "$GITHUB_REF_NAME"

      # The server doesn't send its intermediate cert, so fetch it from the cert's AIA URL to verify the chain.
      - name: Set up FTPS
        if: env.RELEASE == 'true'
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          printf 'machine %s login %s password %s\n' "$FTP_HOST" "$FTP_USER" "$FTP_PASSWORD" > ~/.netrc
          chmod 600 ~/.netrc
          aia=$(echo | openssl s_client -starttls ftp -connect $FTP_HOST:21 2>/dev/null \
            | openssl x509 -noout -ext authorityInfoAccess | sed -n 's/.*CA Issuers - URI://p')
          { cat /etc/ssl/certs/ca-certificates.crt; curl -fsS "$aia" | openssl x509 -inform DER; } > /tmp/ca.pem
          cat > ~/.lftprc <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set ssl:ca-file /tmp/ca.pem
          set cmd:fail-exit true
          set net:timeout 30
          set net:max-retries 2
          set net:reconnect-interval-base 5
          EOF

      # Pull the existing artifact dir so Maven merges the new version into maven-metadata.xml
      # instead of replacing the version list. Skipped when it doesn't exist yet (first release).
      - name: Fetch existing metadata
        if: env.RELEASE == 'true'
        run: |
          if $LFTP -e "cls -d $ARTIFACT_PATH; quit" >/dev/null; then
            $LFTP -e "mirror $ARTIFACT_PATH $REPO/$ARTIFACT_PATH; quit"
          fi

      # Builds, tests and deploys into a file-based Maven repo layout (pom, jar, sources, javadoc, checksums, metadata).
      - run: mvn -B clean deploy -DaltDeploymentRepository=local::file:$REPO

      - name: Upload to repo.internetpolice.eu
        if: env.RELEASE == 'true'
        run: $LFTP -e "mirror -R $REPO/ .; quit"

      - uses: actions/upload-artifact@v4
        with:
          name: maven-repo
          path: ${{ env.REPO }}
